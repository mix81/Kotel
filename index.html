<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fazenda Control</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <div class="house-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
                    <path d="M9 21V12h6v9"/>
                </svg>
                <div class="status-badge">ФАЗЕНДА</div>
            </div>
            <input type="password" id="passInput" placeholder="ПАРОЛЬ" autofocus>
            <button onclick="checkPass()">ВОЙТИ</button>
            <div class="auth-status">
                <div id="dot-auth" class="status-dot"></div>
                <span>СИСТЕМА ГОТОВА</span>
            </div>
        </div>
    </div>

    <div id="main-dashboard" class="dashboard-container">
        <div class="clock-section">
            <div id="clock-time">00:00:00</div>
            <div id="clock-date">Загрузка...</div>
        </div>

        <div class="main-card" onclick="openControl()">
            <div class="card-header">
                <span class="card-title">ОТОПЛЕНИЕ</span>
                <div id="dash_mode_val" class="mode-badge-dash">---</div>
            </div>
            
            <div class="card-temp-main">
                <div class="temp-wrapper">
                    <span id="dash_t_water">--</span><span class="unit">°</span>
                    <span id="dash_t_setpoint" class="temp-target">--</span>
                </div>
            </div>

            <div class="card-footer-indicators">
                <span id="dash_pwr_val">0%</span>
                <div class="heater-dots">
                    <div id="dot_r2" class="t-dot"></div>
                    <div id="dot_r3" class="t-dot"></div>
                </div>
            </div>
        </div>

        <div class="weather-mini">
            <span>НА УЛИЦЕ:</span>
            <span id="t_out_val" class="t-out">--</span><span class="unit">°C</span>
            <div id="dot-main-dash" class="status-dot"></div>
        </div>
    </div>

    <div id="overlay" onclick="closeControl()"></div>
    
    <div id="app-content" class="side-panel">
        <div class="panel-header">
            <div class="header-info">
                <h2>УПРАВЛЕНИЕ КОТЛОМ</h2>
                <div id="dot-main" class="status-dot online"></div>
            </div>
            <button class="close-btn" onclick="closeControl()">&times;</button>
        </div>

        <div class="scroll-area">
            <div class="hero-card">
                <div class="temp-big">
                    <span id="t_water">--</span><span class="deg">°</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="label">МОЩНОСТЬ</span>
                        <span class="value"><span id="pwr">0</span>%</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">СТАТУС</span>
                        <div class="badges">
                            <div id="st_r1" class="badge">Т1</div>
                            <div id="st_r2" class="badge">Т2</div>
                            <div id="st_r3" class="badge">Т3</div>
                            <div id="st_pmp" class="badge">НАСОС</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-title">РЕЖИМ РАБОТЫ</div>
            <div class="mode-selector">
                <div id="m_auto" class="mode-btn" onclick="send('heater/mode/set','auto')">
                    <span class="m-icon">A</span>
                    <span class="m-label">АВТО</span>
                    <div id="badge_auto" class="m-indicator"></div>
                </div>
                <div id="m_manual" class="mode-btn" onclick="send('heater/mode/set','manual')">
                    <span class="m-icon">M</span>
                    <span class="m-label">РУЧНОЙ</span>
                    <div id="badge_manual" class="m-indicator"></div>
                </div>
                <div id="m_off" class="mode-btn" onclick="send('heater/mode/set','off')">
                    <span class="m-icon">✕</span>
                    <span class="m-label">ВЫКЛ</span>
                    <div id="badge_off" class="m-indicator"></div>
                </div>
            </div>

            <div id="card_auto" class="control-card">
                <div class="card-row">
                    <span>УСТАВКА ВОДЫ</span>
                    <div class="stepper">
                        <span id="l_sp" class="step-val">--</span>
                        <input type="range" id="r_sp" min="20" max="75" onchange="send('heater/setpoint/set',this.value)">
                    </div>
                </div>
                <div class="card-row">
                    <span>ПОМЕЩЕНИЕ</span>
                    <div class="stepper">
                        <span id="l_rt" class="step-val">--</span>
                        <input type="range" id="r_rt" min="5" max="30" step="0.5" onchange="send('heater/room_temp/set',this.value)">
                    </div>
                </div>
            </div>

            <div class="control-card">
                <div id="manual_zone" class="manual-grid">
                    <div class="man-item">
                        <span>ТЭН 2</span>
                        <div id="sw_r2" class="toggle-btn" onclick="toggleRelay('heater/relay2/set','r2')"></div>
                    </div>
                    <div class="man-item">
                        <span>ТЭН 3</span>
                        <div id="sw_r3" class="toggle-btn" onclick="toggleRelay('heater/relay3/set','r3')"></div>
                    </div>
                </div>
            </div>

            <div class="pid-section">
                <div class="pid-row"><span>K-FACTOR</span><input type="number" id="i_kf" onchange="send('heater/k_factor/set',this.value)"></div>
                <div class="pid-row"><span>Kp</span><input type="number" id="i_kp" onchange="send('heater/kp/set',this.value)"></div>
                <div class="pid-row"><span>Ki</span><input type="number" id="i_ki" onchange="send('heater/ki/set',this.value)"></div>
                <div class="pid-row"><span>Kd</span><input type="number" id="i_kd" onchange="send('heater/kd/set',this.value)"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
