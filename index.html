                <button id="m_auto" onclick="send('heater/mode/set','auto')">АВТО</button>
                <button id="m_manual" onclick="send('heater/mode/set','manual')">РУЧНОЙ</button>
                <button id="m_off" onclick="send('heater/mode/set','off')">ВЫКЛ</button>
            </div>
            <div class="control-section">
                <div class="range-info"><span>Цель (Вода):</span><b id="l_sp" class="val-highlight">--</b></div>
                <div class="ctrl-to-lock" id="lock_manual">
                    <input type="range" min="20" max="75" id="r_sp" oninput="document.getElementById('l_sp').innerText=this.value" onchange="send('heater/setpoint/set', this.value)">
                    <div class="relay-item"><span>ТЭН Ступень 2</span><button id="sw_r2" class="toggle-btn" onclick="toggleRelay('heater/relay2/set', 'r2')"></button></div>

                <div class="ctrl-to-lock" id="lock_auto">
                    <input type="range" min="18" max="28" step="0.5" id="r_rt" oninput="document.getElementById('l_rt').innerText=this.value" onchange="send('heater/room_temp/set', this.value)">
                    <div class="input-inline"><span>Кривая (K-Factor):</span><input type="number" step="0.05" id="i_kf" onchange="send('heater/k_factor/set', this.value)"></div>
                    <div class="pid-grid">
                        <div class="pid-col"><small>Kp</small><input type="number" id="i_kp" onchange="send('heater/kp/set', this.value)"></div>
                        <div class="pid-col"><small>Ki</small><input type="number" id="i_ki" onchange="send('heater/ki/set', this.value)"></div>
                        <div class="pid-col"><small>Kd</small><input type="number" id="i_kd" onchange="send('heater/kd/set', this.value)"></div>
