<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heating Pro Fazenda</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/553/553376.png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <i class="fa-solid fa-house-chimney blue-house"></i>
            <div class="fazenda-badge">ФАЗЕНДА <span id="dot-auth" class="status-dot"></span></div>
            <input type="password" id="passInput" placeholder="ПАРОЛЬ">
            <button class="enter-btn" onclick="checkPass()">ВОЙТИ</button>
        </div>
    </div>

    <div id="app-content">
        <div id="dashboard-view">
            <div class="clock-container">
                <div id="clock-time">00:00</div>
                <div id="clock-date">...</div>
            </div>

            <div class="card" id="main-dash-card" onclick="openOverlay()">
                <h3>Котел <span id="dot-main" class="status-dot"></span></h3>
                <div id="badge_auto" class="mode-badge badge-auto">AUTO</div>
                <div id="badge_manual" class="mode-badge badge-manual">MANUAL</div>
                <div id="badge_off" class="mode-badge badge-off">OFF</div>
                <div class="temp-row">
                    <div class="val-display"><span id="t_water">--</span><small>°</small></div>
                    <div class="target-box">
                        <div class="target-label">Цель</div>
                        <div class="target-val"><span id="l_sp_dash">--</span><small>°</small></div>
                    </div>
                </div>
                <div class="grid-status">
                    <div id="st_r2_dash" class="badge">ТЭН 2</div>
                    <div id="st_r3_dash" class="badge">ТЭН 3</div>
                </div>
                <div class="pwr-badge">Мощность ТЭН 1: <span id="pwr_val">--%</span></div>
            </div>
        </div>

        <div id="controls-overlay">
            <div class="unified-card">
                <div class="column">
                    <h3 class="col-title">УПРАВЛЕНИЕ</h3>
                    <div class="btn-group">
                        <button id="m_auto" onclick="send('heater/mode/set','auto')">AUTO</button>
                        <button id="m_manual" onclick="send('heater/mode/set','manual')">MANUAL</button>
                        <button id="m_off" onclick="send('heater/mode/set','off')">OFF</button>
                    </div>
                    <div id="group_manual">
                        <div class="ctrl-row"><span>Вода:</span><b id="l_sp">--</b></div>
                        <input type="range" min="20" max="75" id="r_sp" oninput="document.getElementById('l_sp').innerText=this.value" onchange="sendSetpoint(this.value)">
                        <div class="relay-item"><span>ТЭН 2</span><button id="sw_r2" class="toggle-btn" onclick="toggleRelay('heater/relay2/set', 'r2')"></button></div>
                        <div class="relay-item"><span>ТЭН 3</span><button id="sw_r3" class="toggle-btn" onclick="toggleRelay('heater/relay3/set', 'r3')"></button></div>
                    </div>
                </div>
                <div class="column-divider"></div>
                <div class="column">
                    <h3 class="col-title">ПЗА / УЛИЦА: <span id="t_out_val">--</span>°</h3>
                    <div id="group_pza">
                        <div class="ctrl-row">Цель комната: <b id="l_rt">--</b>°</div>
                        <input type="range" min="18" max="28" step="0.5" id="r_rt" oninput="document.getElementById('l_rt').innerText=this.value" onchange="send('heater/room_temp/set', this.value)">
                        <div class="kf-row">
                            <span>K-Factor:</span>
                            <input type="number" step="0.05" id="i_kf" onchange="send('heater/k_factor/set', this.value)">
                        </div>
                        <div class="pid-grid">
                            <div><small>Kp</small><br><input type="number" step="0.1" id="i_kp" onchange="send('heater/kp/set', this.value)"></div>
                            <div><small>Ki</small><br><input type="number" step="0.01" id="i_ki" onchange="send('heater/ki/set', this.value)"></div>
                            <div><small>Kd</small><br><input type="number" step="0.1" id="i_kd" onchange="send('heater/kd/set', this.value)"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="close-btn" onclick="closeOverlay()">ЗАКРЫТЬ</div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
